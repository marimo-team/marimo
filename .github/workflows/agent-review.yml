name: Agent Review
on:
  pull_request_target:
    types: [labeled]

permissions: {}

jobs:
  agent-review:
    if: github.event.label.name == 'agent-review'
    concurrency:
      group: agent-review-${{ github.event.pull_request.number }}
    # Upper bound for the reusable workflow; each of its jobs narrows this further.
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
      id-token: write # Doppler OIDC
    uses: marimo-team/.github/.github/workflows/agent-review.yml@1eb4e7f54b34e6a74f1c15f242b478489287054b
    with:
      policy-ref: 1eb4e7f54b34e6a74f1c15f242b478489287054b
