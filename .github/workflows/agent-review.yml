name: Agent Review
on:
  pull_request_target:
    types: [labeled]

permissions: {}

jobs:
  agent-review:
    if: github.event.label.name == 'agent-review'
    concurrency:
      group: agent-review-${{ github.event.pull_request.number }}
    # Upper bound for the reusable workflow; each of its jobs narrows this further.
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
      id-token: write # Doppler OIDC
    uses: marimo-team/.github/.github/workflows/agent-review.yml@c79c7d7a3009b4f7223b0ec9fee2228523e77883
    with:
      policy-ref: c79c7d7a3009b4f7223b0ec9fee2228523e77883
