name: Agent Review
on:
  pull_request_target:
    types: [labeled]

permissions: {}

jobs:
  agent-review:
    if: github.event.label.name == 'agent-review'
    concurrency:
      group: agent-review-${{ github.event.pull_request.number }}
    # Upper bound for the reusable workflow; each of its jobs narrows this further.
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
      id-token: write # Doppler OIDC
    uses: marimo-team/.github/.github/workflows/agent-review.yml@0ab9e1d846c8e95d17bebc3d49c1fd6f31505c3f
    with:
      policy-ref: 0ab9e1d846c8e95d17bebc3d49c1fd6f31505c3f
