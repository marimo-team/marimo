name: Agent Review
on:
  pull_request_target:
    types: [labeled]

permissions: {}

jobs:
  agent-review:
    if: github.event.label.name == 'agent-review'
    concurrency:
      group: agent-review-${{ github.event.pull_request.number }}
    # Upper bound for the reusable workflow; each of its jobs narrows this further.
    permissions:
      contents: read
      pull-requests: read
      id-token: write # Doppler OIDC
    uses: marimo-team/.github/.github/workflows/agent-review.yml@76bc4b6ca77b0d0df045b0cbdaa6f941342c26a8
    with:
      policy-ref: 76bc4b6ca77b0d0df045b0cbdaa6f941342c26a8
