name: Publish Package to npm

on:
  workflow_call:
    inputs:
      package-artifact-name:
        required: true
        type: string
        description: 'Name of the artifact containing the built package'
      working-directory:
        required: false
        type: string
        default: '.'
        description: 'Directory within the artifact to publish from'
      npm-tag:
        required: false
        type: string
        default: ''
        description: 'npm tag to use when publishing (e.g., "dev", "next"). Leave empty for default (latest)'

jobs:
  publish:
    runs-on: "${{ vars.CI_RUNNER_SMALL || 'ubuntu-latest' }}"
    permissions:
      id-token: write  # Required for OIDC authentication and provenance
      contents: read
    steps:
      - name: 📦 Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: 📥 Download built package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.package-artifact-name }}
          path: ${{ inputs.working-directory }}

      - name: 📤 Publish to npm
        working-directory: ${{ inputs.working-directory }}
        env:
          NODE_AUTH_TOKEN: "" # Clear placeholder set by setup-node to enable OIDC
          NPM_TAG: ${{ inputs.npm-tag }}
        run: |
          TAG_FLAGS=()
          if [ -n "$NPM_TAG" ]; then
            TAG_FLAGS=(--tag "$NPM_TAG")
          fi

          for i in {1..3}; do
            if npm publish --access public --provenance "${TAG_FLAGS[@]}"; then
              exit 0
            fi
            echo "Publish attempt $i failed, retrying..."
            sleep 10
          done
          exit 1
