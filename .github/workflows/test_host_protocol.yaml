name: Host protocol

on:
  pull_request:
    paths:
      - "protocols/**"
      - "packages/host-protocol/**"
      - "frontend/.oxlintrc.json"
      - "frontend/lint/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "tsconfig.json"
      - ".github/actions/install/**"
      - "marimo/_core/protocol.py"
      - "tests/_core/test_protocol.py"
      - "tests/_core/test_calls.py"
      - "tests/_lint/test_host_protocol_codegen.py"
      - "tests/_lint/test_host_protocol_documents.py"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/test_host_protocol.yaml"

permissions:
  contents: read

concurrency:
  group: host-protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-p-small
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/install
      - name: Check Effect contracts and generation tooling
        run: |
          pnpm --dir packages/host-protocol typecheck
          pnpm --dir packages/host-protocol build
          pnpm --dir packages/host-protocol lint
          pnpm --dir packages/host-protocol test
      - name: Check Python model generation and portable fixtures
        run: make host-protocol-check
      - name: Check generated Python bindings against fixtures
        run: uv run --group test pytest tests/_core/test_protocol.py tests/_core/test_calls.py tests/_lint/test_host_protocol_codegen.py tests/_lint/test_host_protocol_documents.py
      - name: Lint protocol tooling
        run: |
          uv run ruff check protocols
          uv run ruff format --check protocols
