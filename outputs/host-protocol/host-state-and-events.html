<div id="host-state-explainer">
  <style>
    #host-state-explainer { color: var(--foreground); }
    #host-state-explainer .hp-heading { padding-right: 92px; }
    #host-state-explainer .hp-toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 16px 0; }
    #host-state-explainer .hp-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; margin: 20px 0; }
    #host-state-explainer .hp-tree { border-left: 1px solid var(--border); padding-left: 14px; margin-top: 12px; }
    #host-state-explainer .hp-record { padding: 8px 0; overflow-wrap: anywhere; }
    #host-state-explainer .hp-record > span { display: block; }
    #host-state-explainer .hp-kind { color: var(--muted-foreground); }
    #host-state-explainer .hp-track { position: relative; height: 18px; margin: 10px 0; }
    #host-state-explainer .hp-track::before { content: ''; position: absolute; left: 0; right: 0; top: 8px; height: 1px; background: var(--border); }
    #host-state-explainer .hp-dot { position: absolute; width: 9px; height: 9px; top: 4px; left: 0; border-radius: 50%; background: var(--viz-series-1); }
    #host-state-explainer .hp-wire { overflow-wrap: anywhere; }
    #host-state-explainer pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 10px 0; }
    #host-state-explainer .hp-detail { margin-top: 12px; }
    #host-state-explainer [data-changed="true"] { background: color-mix(in srgb, var(--viz-series-1) 10%, transparent); }
    @media (max-width: 420px) {
      #host-state-explainer .hp-columns { gap: 12px; }
      #host-state-explainer .hp-tree { padding-left: 8px; }
    }
  </style>
  <h3 class="hp-heading">A notebook, two views</h3>
  <div class="hp-toolbar">
    <button class="btn" type="button" data-back>Back</button>
    <button class="btn btn-primary" type="button" data-next>Open stream</button>
    <span class="text-small tabular-nums" data-step></span>
  </div>
  <div class="viz-row"><span class="viz-badge" data-phase></span><span data-title></span></div>
  <div class="hp-columns" role="group" aria-label="Host state and the client's local view">
    <section aria-label="Host state">
      <strong>Host owns</strong>
      <div class="hp-tree" data-host></div>
    </section>
    <section aria-label="Client state">
      <strong>Client has observed</strong>
      <div class="hp-tree" data-client></div>
    </section>
  </div>
  <hr>
  <div class="hp-wire">
    <span class="text-small" data-direction></span>
    <div class="hp-track" aria-hidden="true"><span class="hp-dot" data-dot hidden></span></div>
    <pre><code data-wire></code></pre>
  </div>
  <div class="hp-detail" aria-live="polite" data-detail></div>
  <div class="text-small text-muted">Illustrative records · selected fields · optional analysis omitted</div>
  <script>
    (() => {
      const root = document.getElementById('host-state-explainer');
      const find = (s) => root.querySelector(s);
      const stages = [
        { phase: 'Catalog', title: 'A file is indexed', next: 'Open stream', direction: 'No notebook stream yet', wire: 'forecasts.py  →  notebook n1', detail: 'The catalog knows n1; its document has not been loaded yet.' },
        { phase: 'Connect', title: 'Read the file; retain the document', next: 'Send notebook', direction: 'Client → host · HTTP', wire: 'GET /notebooks/n1/events', detail: 'First access loads the document and creates attachment a1; no runtime is started.' },
        { phase: 'Snapshot', title: 'Describe the notebook', next: 'Send first cell', direction: 'Host → client · SSE', wire: 'event: notebook\ndata: {"notebook":{"id":"n1","name":"forecasts",…}}', detail: 'The client stores the notebook record by id.' },
        { phase: 'Snapshot', title: 'Describe cell c1', next: 'Send second cell', direction: 'Host → client · SSE', wire: 'event: cell\ndata: {"cell":{"id":"c1","code":"x = 21","version":1,…}}', detail: 'This event describes a cell that already exists on the host.' },
        { phase: 'Snapshot', title: 'Describe cell c2', next: 'Send document', direction: 'Host → client · SSE', wire: 'event: cell\ndata: {"cell":{"id":"c2","code":"y = x * 2","version":1,…}}', detail: 'The client accumulates records as the snapshot arrives.' },
        { phase: 'Snapshot', title: 'Describe document order', next: 'Send attachment', direction: 'Host → client · SSE', wire: 'event: document\ndata: {"document":{"notebook_id":"n1","order":["c1","c2"],"version":1,…}}', detail: 'The document supplies cell order and configuration, with its own revision.' },
        { phase: 'Snapshot', title: 'Describe this connection', next: 'Send ready', direction: 'Host → client · SSE', wire: 'event: attachment\ndata: {"attachment":{"id":"a1","notebook_id":"n1",…}}', detail: 'Each opening of the notebook stream has its own attachment.' },
        { phase: 'Live', title: 'The snapshot is complete', next: 'Edit c1', direction: 'Host → client · SSE', wire: 'id: opaque-cursor-A\nevent: ready\ndata: {}', detail: 'ready marks the snapshot boundary; the same stream now follows changes.' },
        { phase: 'Operation', title: 'Accept an edit on the host', next: 'Send changed cell', direction: 'Client → host · HTTP', wire: 'POST /notebooks/n1/edits\nIdempotency-Key: edit-1\n\nput_cell c1: x = 22  [matching cell etag]', detail: 'The host applies the edit atomically; this client view waits for its events.' },
        { phase: 'Live', title: 'Replace the observed cell', next: 'Send document revision', direction: 'Host → client · SSE', wire: 'id: opaque-cursor-B\nevent: cell\ndata: {"cell":{"id":"c1","code":"x = 22","version":2,…},"request_id":"edit-1",…}', detail: 'The same cell event shape updates the existing record by id.' },
        { phase: 'Live', title: 'Complete the document change', next: 'Disconnect', direction: 'Host → client · SSE', wire: 'id: opaque-cursor-C\nevent: document\ndata: {"document":{"notebook_id":"n1","version":2,…},"request_id":"edit-1",…}', detail: 'The current document changed; its saved revision still names the file’s earlier content.' },
        { phase: 'Disconnected', title: 'The host still owns the notebook', next: null, direction: 'Connection closed', wire: 'attachment a1 removed on host', detail: 'The attachment ends; the loaded document remains in this host’s memory.' }
      ];
      let step = 0;
      let animation;
      const row = (kind, value, changed = false) => {
        const el = document.createElement('div');
        el.className = 'hp-record';
        el.dataset.changed = String(changed);
        const label = document.createElement('span');
        label.className = 'hp-kind text-small';
        label.textContent = kind;
        const content = document.createElement('span');
        content.textContent = value;
        el.append(label, content);
        return el;
      };
      function paint(animate = false) {
        const s = stages[step];
        const host = find('[data-host]');
        const client = find('[data-client]');
        host.replaceChildren(row('Notebook', 'n1 · forecasts'));
        client.replaceChildren();
        if (step === 0) {
          host.append(row('Document', 'Not loaded'), row('Runtime', 'None'));
        } else {
          host.append(
            row('Cell c1', step >= 8 ? 'x = 22' : 'x = 21', step === 8),
            row('Cell c2', 'y = x * 2'),
            row('Document', `c1 → c2 · v${step >= 8 ? 2 : 1}`, step === 8),
            row('Storage', step >= 8 ? 'Earlier revision saved' : 'Current revision saved'),
            row('Runtime', 'None'),
            row('Attachment', step === 11 ? 'None' : 'a1', step === 1 || step === 11)
          );
        }
        if (step < 2) client.append(row('Notebook view', 'Empty'));
        if (step >= 2) client.append(row('Notebook', 'n1 · forecasts', step === 2));
        if (step >= 3) client.append(row('Cell c1', step >= 9 ? 'x = 22' : 'x = 21', step === 3 || step === 9));
        if (step >= 4) client.append(row('Cell c2', 'y = x * 2', step === 4));
        if (step >= 5) client.append(row('Document', `c1 → c2 · v${step >= 10 ? 2 : 1}`, step === 5 || step === 10));
        if (step >= 6) client.append(row('Attachment', step === 11 ? 'a1 · last observed' : 'a1', step === 6));
        if (step >= 7) client.append(row('Connection', step === 11 ? 'Closed · cached view' : 'Live', step === 7 || step === 11));
        find('[data-phase]').textContent = s.phase;
        find('[data-title]').textContent = s.title;
        find('[data-direction]').textContent = s.direction;
        find('[data-wire]').textContent = s.wire;
        find('[data-detail]').textContent = s.detail;
        find('[data-step]').textContent = `${step + 1} / ${stages.length}`;
        find('[data-back]').disabled = step === 0;
        find('[data-next]').disabled = !s.next;
        find('[data-next]').textContent = s.next || 'Complete';
        const dot = find('[data-dot]');
        if (animation) animation.cancel();
        dot.hidden = !animate || step === 0 || step === 11;
        if (!dot.hidden) {
          const reverse = step === 1 || step === 8;
          const distance = Math.max(0, find('.hp-track').clientWidth - 9);
          const from = reverse ? distance : 0;
          const to = reverse ? 0 : distance;
          if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            animation = dot.animate([{ transform: `translateX(${from}px)` }, { transform: `translateX(${to}px)` }], { duration: 650, easing: 'ease-in-out', fill: 'forwards' });
          } else {
            dot.style.transform = `translateX(${to}px)`;
          }
        }
      }
      function restore(saved) {
        const value = saved?.privateContent?.step;
        step = Number.isInteger(value) && value >= 0 && value < stages.length ? value : 0;
        paint();
      }
      function move(delta) {
        step = Math.max(0, Math.min(stages.length - 1, step + delta));
        paint(delta > 0);
        window.openai?.setWidgetState?.({ modelContent: { topic: 'Host protocol: retained state and notebook events', stage: stages[step].title }, privateContent: { step } }).catch(() => {});
      }
      find('[data-back]').addEventListener('click', () => move(-1));
      find('[data-next]').addEventListener('click', () => move(1));
      window.addEventListener('openai:set_globals', (event) => {
        if (event.detail?.globals && 'widgetState' in event.detail.globals) restore(event.detail.globals.widgetState);
      });
      restore(window.openai?.widgetState);
    })();
  </script>
</div>
