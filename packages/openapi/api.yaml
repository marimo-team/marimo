      type: object
    ModelUpdate:
      description: "State sync - changed traits only.\n\nAttributes:\n    state: Changed\
        \ trait values, minus `_esm` (see `ModelOpen`).\n    buffer_paths: Paths into\
        \ `state` whose binary values were\n        extracted into `buffers`.\n  \
        \  buffers: Binary payloads, parallel to `buffer_paths`.\n    esm_spec: Present\
        \ only when the widget's `_esm` changed on a\n        live model (hot reload,\
        \ edit mode only). A spec whose\n        `hash` differs from the current one\
        \ tells the frontend the\n        widget's code changed and views must be\
        \ rebuilt."
      properties:
        buffer_paths:
          items:
            items:
              anyOf:
              - type: string
              - type: integer
            type: array
          type: array
        buffers:
          items:
