        next_page_token:
          anyOf:
          - type: string
          - type: 'null'
          default: null
        op:
          enum:
          - storage-entries
        prefix:
          anyOf:
          - type: string
          - type: 'null'
          default: null
        query:
          anyOf:
          - type: string
          - type: 'null'
          default: null
        request_id:
          $ref: '#/components/schemas/RequestId'
      required:
      - op
      - request_id
      - entries
      - namespace
      title: StorageEntriesNotification
      type: object
    StorageEntry:
      description: "A storage entry is a file, directory, or object for external storage\
        \ systems\n\nAttributes:\n    path: The path of the storage entry.\n    kind:\
        \ The kind of the storage entry.\n    size: The size of the storage entry.\n\
        \    last_modified: The last modified time of the storage entry.\n    metadata:\
        \ The metadata of the storage entry.\n    mime_type: The MIME type of the\
        \ storage entry, or None for directories."
      properties:
        kind:
          enum:
          - directory
          - file
          - object
        lastModified:
          anyOf:
          - type: number
          - type: 'null'
        metadata:
          default: {}
          type: object
        mimeType:
          anyOf:
          - type: string
          - type: 'null'
          default: null
        path:
          type: string
        size:
          type: integer
      required:
      - path
      - kind
      - size
      - lastModified
      title: StorageEntry
      type: object
    StorageHidesWhen:
      description: Hide this suggestion when a live storage namespace matches.
      properties:
        backendTypes:
          items:
            type: string
          type: array
        kind:
          enum:
          - storage
        protocols:
          items:
            type: string
          type: array
      required:
      - kind
      - protocols
      - backendTypes
      title: StorageHidesWhen
      type: object
    StorageListEntriesRequest:
      properties:
        limit:
          type: integer
        namespace:
          type: string
        pageToken:
          anyOf:
          - type: string
          - type: 'null'
          default: null
        prefix:
          anyOf:
          - type: string
          - type: 'null'
          default: null
        requestId:
          $ref: '#/components/schemas/RequestId'
      required:
      - requestId
      - namespace
      - limit
      title: StorageListEntriesRequest
      type: object
    StorageNamespace:
      description: "Represents external storage systems (filesystems and object storage)\n\
        \nAttributes:\n    name: The variable name of the storage namespace.\n   \
        \ display_name: The display name of the storage namespace.\n    protocol:\
        \ The protocol of the storage namespace. E.g. s3, gcs, azure, http, file,\
        \ in-memory.\n    root_path: The root path of the storage namespace.\n   \
        \ backend_type: The type of the storage backend (fsspec or obstore)\n    storage_entries:\
        \ The storage entries in the storage namespace."
      properties:
        backendType:
          enum:
          - fsspec
          - huggingface
          - obstore
        displayName:
          type: string
        name:
          $ref: '#/components/schemas/VariableName'
        protocol:
          type: string
        rootPath:
          type: string
        storageEntries:
          items:
            $ref: '#/components/schemas/StorageEntry'
          type: array
      required:
      - name
      - displayName
      - protocol
      - rootPath
      - backendType
      - storageEntries
      title: StorageNamespace
      type: object
    StorageNamespacesNotification:
      description: "Available storage namespaces for storage inspector.\n\nAttributes:\n\
        \    namespaces: Available storage namespaces."
      properties:
        namespaces:
          items:
            $ref: '#/components/schemas/StorageNamespace'
          type: array
        op:
          enum:
          - storage-namespaces
      required:
      - op
      - namespaces
      title: StorageNamespacesNotification
      type: object
    StoreConfig:
      description: Configuration for a single cache store.
      properties:
        args:
          default: {}
          description: Keyword arguments passed to the cache store constructor.
          type: object
        type:
          anyOf:
          - enum:
            - file
            - redis
            - rest
            - tiered
          - type: string
          default: file
          description: Cache store backend or installed entry-point name.
      required:
      - type
      - args
      title: StoreConfig
      type: object
    SuccessResponse:
      properties:
        success:
          default: true
          type: boolean
      required: []
      title: SuccessResponse
      type: object
    SyncSandboxResponse:
      properties:
        error:
          anyOf:
          - type: string
          - type: 'null'
          default: null
        reconnect:
          default: false
          type: boolean
        restartRequired:
          default: false
          type: boolean
        success:
          type: boolean
      required:
      - success
      title: SyncSandboxResponse
      type: object
    ToolDefinition:
      description: Tool definition compatible with ai-sdk-ui format.
      properties:
        description:
          type: string
        mode:
          items:
            enum:
            - agent
            - ask
            - code_mode
            - manual
          type: array
        name:
          type: string
        parameters:
          type: object
        source:
          enum:
          - backend
          - frontend
          - mcp
      required:
      - name
      - description
      - parameters
      - source
      - mode
      title: ToolDefinition
      type: object
    Transaction:
      description: 'An atomic batch of changes applied to a NotebookDocument.


        `source` identifies the writer (e.g. `"frontend"`, `"kernel"`).

        `version` is `None` when created and stamped by

        `NotebookDocument.apply()`.'
      properties:
        changes:
          items:
            anyOf:
            - $ref: '#/components/schemas/CreateCell'
            - $ref: '#/components/schemas/DeleteCell'
            - $ref: '#/components/schemas/MoveCell'
            - $ref: '#/components/schemas/ReorderCells'
            - $ref: '#/components/schemas/SetCode'
            - $ref: '#/components/schemas/SetName'
            - $ref: '#/components/schemas/SetConfig'
            discriminator:
              mapping:
                create-cell: '#/components/schemas/CreateCell'
                delete-cell: '#/components/schemas/DeleteCell'
                move-cell: '#/components/schemas/MoveCell'
                reorder-cells: '#/components/schemas/ReorderCells'
                set-code: '#/components/schemas/SetCode'
                set-config: '#/components/schemas/SetConfig'
                set-name: '#/components/schemas/SetName'
              propertyName: type
          type: array
        source:
          enum:
          - cell-manager
          - code-mode
          - file-watch
          - frontend
          - host
          - kernel
        version:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
      required:
      - changes
      - source
      title: Transaction
      type: object
    TyLanguageServerConfig:
      description: 'Configuration options for Ty Language Server.


        ty handles completion, hover, go-to-definition, and diagnostics,

        but we only use it for diagnostics.'
      properties:
        enabled:
          description: Enable this language server.
          type: boolean
      required: []
      title: TyLanguageServerConfig
      type: object
    UIElementId:
      format: ui-element-id
      type: string
    UIElementMessageNotification:
      description: "Sends a message to a UI element/widget.\n\nAttributes:\n    ui_element:\
        \ UI element identifier.\n    message: Message payload as dictionary.\n  \
        \  buffers: Optional binary buffers for large data."
      properties:
        buffers:
          anyOf:
          - items:
              $ref: '#/components/schemas/Base64String'
            type: array
          - type: 'null'
          default: null
        message:
          type: object
        op:
          enum:
          - send-ui-element-message
        ui_element:
          $ref: '#/components/schemas/UIElementId'
      required:
      - op
      - ui_element
      - message
      title: UIElementMessageNotification
      type: object
    UnknownError:
      properties:
        error_type:
          anyOf:
          - type: string
          - type: 'null'
          default: null
        msg:
          type: string
        type:
          enum:
          - unknown
      required:
      - type
      - msg
      title: UnknownError
      type: object
    UpdateCellConfigCommand:
      description: "Update cell configuration.\n\nUpdates cell-level settings like\
        \ disabled state, hide code, etc.\n\nAttributes:\n    configs: Cell IDs mapped\
        \ to their config updates. Each config dict\n             can contain partial\
        \ updates."
      properties:
        configs:
          additionalProperties:
            type: object
          type: object
        type:
          enum:
          - update-cell-config
      required:
      - type
      - configs
      title: UpdateCellConfigCommand
      type: object
    UpdateCellOutputsRequest:
      properties:
        cellIdsToOutput:
          additionalProperties:
            items: false
            maxItems: 2
            minItems: 2
            prefixItems:
            - enum:
              - application/json
              - application/vnd.jupyter.widget-view+json
              - application/vnd.marimo+error
              - application/vnd.marimo+mimebundle
              - application/vnd.marimo+traceback
              - application/vnd.vega.v5+json
              - application/vnd.vega.v6+json
              - application/vnd.vegalite.v5+json
              - application/vnd.vegalite.v6+json
              - image/avif
              - image/bmp
              - image/gif
              - image/jpeg
              - image/png
              - image/svg+xml
              - image/tiff
              - text/csv
              - text/html
              - text/latex
              - text/markdown
              - text/password
              - text/plain
              - video/mp4
              - video/mpeg
            - {}
            type: array
          type: object
      required:
      - cellIdsToOutput
      title: UpdateCellOutputsRequest
      type: object
    UpdateManifestRequest:
      properties:
        contents:
          type: string
        fileKey:
          anyOf:
          - type: string
          - type: 'null'
          default: null
        previous:
          type: string
      required:
      - contents
      - previous
      title: UpdateManifestRequest
      type: object
    UpdateUIElementCommand:
      description: "Update UI element values.\n\nTriggered when users interact with\
        \ UI elements (sliders, inputs, dropdowns, etc.).\nUpdates element values\
        \ and re-executes dependent cells.\n\nAttributes:\n    object_ids: UI elements\
        \ to update.\n    values: New values for the elements. Must match length of\
        \ object_ids.\n    request: HTTP request context if available.\n    token:\
        \ Unique request identifier for deduplication."
      properties:
        objectIds:
          items:
            $ref: '#/components/schemas/UIElementId'
          type: array
        request:
          anyOf:
          - $ref: '#/components/schemas/HTTPRequest'
          - type: 'null'
          default: null
        token:
          type: string
        type:
          enum:
          - update-ui-element
        values:
          type: array
      required:
      - type
      - objectIds
      - values
      title: UpdateUIElementCommand
      type: object
    UpdateUIElementRequest:
      properties:
        objectIds:
          items:
            $ref: '#/components/schemas/UIElementId'
          type: array
        request:
          anyOf:
          - $ref: '#/components/schemas/HTTPRequest'
          - type: 'null'
          default: null
        token:
          type: string
        values:
          type: array
      required:
      - objectIds
      - values
      title: UpdateUIElementRequest
      type: object
    UpdateUIElementValuesRequest:
      properties:
        objectIds:
          items:
            $ref: '#/components/schemas/UIElementId'
          type: array
        values:
          type: array
      required:
      - objectIds
      - values
      title: UpdateUIElementValuesRequest
      type: object
    UpdateUserConfigRequest:
      properties:
        config:
          type: object
      required:
      - config
      title: UpdateUserConfigRequest
      type: object
    ValidateSQLCommand:
      description: "Validate an SQL query.\n\nChecks if an SQL query is valid by parsing\
        \ against a dialect (no DB connection)\nor validating against an actual database.\n\
        \nAttributes:\n    request_id: Unique identifier for this request.\n    query:\
        \ SQL query to validate.\n    only_parse: If True, only parse using dialect.\
        \ If False, validate against DB.\n    engine: SQL engine (required if only_parse\
        \ is False).\n    dialect: SQL dialect for parsing (required if only_parse\
        \ is True)."
      properties:
        dialect:
          anyOf:
          - type: string
          - type: 'null'
          default: null
        engine:
          anyOf:
          - type: string
          - type: 'null'
          default: null
        onlyParse:
          type: boolean
        query:
          type: string
        requestId:
          $ref: '#/components/schemas/RequestId'
        type:
          enum:
          - validate-sql
      required:
      - type
      - requestId
      - query
      - onlyParse
      title: ValidateSQLCommand
      type: object
    ValidateSQLRequest:
      properties:
        dialect:
          anyOf:
          - type: string
          - type: 'null'
          default: null
        engine:
          anyOf:
          - type: string
          - type: 'null'
          default: null
        onlyParse:
          type: boolean
        query:
          type: string
        requestId:
          $ref: '#/components/schemas/RequestId'
      required:
      - requestId
      - query
      - onlyParse
      title: ValidateSQLRequest
      type: object
    ValidateSQLResultNotification:
      description: "SQL query validation result.\n\nAttributes:\n    request_id: Request\
        \ ID this responds to.\n    parse_result: SQL parsing result.\n    validate_result:\
        \ Catalog validation result.\n    error: Error message if failed."
      properties:
        error:
          anyOf:
          - type: string
          - type: 'null'
          default: null
        op:
          enum:
          - validate-sql-result
        parse_result:
          anyOf:
          - $ref: '#/components/schemas/SqlParseResult'
          - type: 'null'
          default: null
        request_id:
          $ref: '#/components/schemas/RequestId'
        validate_result:
          anyOf:
          - $ref: '#/components/schemas/SqlCatalogCheckResult'
          - type: 'null'
          default: null
      required:
      - op
      - request_id
      title: ValidateSQLResultNotification
      type: object
    VariableContext:
      properties:
        name:
          type: string
        previewValue: {}
        valueType:
          type: string
      required:
      - name
      - valueType
      - previewValue
      title: VariableContext
      type: object
    VariableDeclarationNotification:
      description: "Variable declaration and usage for dataflow graph.\n\nAttributes:\n\
        \    name: Variable name.\n    declared_by: Cell IDs that define this variable.\n\
        \    used_by: Cell IDs that use this variable."
      properties:
        declared_by:
          items:
            $ref: '#/components/schemas/CellId'
          type: array
        name:
          $ref: '#/components/schemas/VariableName'
        used_by:
          items:
            $ref: '#/components/schemas/CellId'
          type: array
      required:
      - name
      - declared_by
      - used_by
      title: VariableDeclarationNotification
      type: object
    VariableName:
      format: variable-name
      type: string
    VariableRemoval:
      description: A binding removed from the runtime's namespace.
      properties:
        execution_id:
          type: string
        name:
          type: string
      required:
      - name
      - execution_id
      title: VariableRemoval
      type: object
    VariableValue:
      description: "Variable value and type for variables panel.\n\nAttributes:\n\
        \    name: Variable name.\n    value: String representation of value.\n  \
        \  datatype: Data type as string."
      properties:
        datatype:
          anyOf:
          - type: string
          - type: 'null'
        execution_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
        name:
          type: string
        revision:
          anyOf:
          - $ref: '#/components/schemas/Revision'
          - type: 'null'
          default: null
        value:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - name
      - value
      - datatype
      title: VariableValue
      type: object
    VariableValuesNotification:
      description: "Current variable values.\n\nAttributes:\n    variables: Variables\
        \ with current values and types.\n    removed: Bindings that no longer exist,\
        \ identified by their producer."
      properties:
        op:
          enum:
          - variable-values
        removed:
          default: []
          items:
            $ref: '#/components/schemas/VariableRemoval'
          type: array
        variables:
          items:
            $ref: '#/components/schemas/VariableValue'
          type: array
      required:
      - op
      - variables
      title: VariableValuesNotification
      type: object
    VariablesNotification:
      description: "Variable dataflow graph.\n\nAttributes:\n    variables: Variable\
        \ declarations and usage."
      properties:
        op:
          enum:
          - variables
        variables:
          items:
            $ref: '#/components/schemas/VariableDeclarationNotification'
          type: array
      required:
      - op
      - variables
      title: VariablesNotification
      type: object
    VenvConfig:
      description: 'Configuration for an external Python environment in edit mode.


        Launches the notebook kernel in an existing virtualenv. Applies to

        single notebooks and directories when editing without `--sandbox`.'
      properties:
        path:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: path to a virtualenv directory (absolute or relative to pyproject.toml)
        writable:
          default: false
          description: if true, marimo will manage script metadata (inline dependencies).
            Defaults to false.
          type: boolean
      required:
      - path
      - writable
      title: VenvConfig
      type: object
    WidgetModelId:
      format: widget-model-id
      type: string
    WorkspaceFilesRequest:
      properties:
        includeMarkdown:
          default: false
          type: boolean
      required: []
      title: WorkspaceFilesRequest
      type: object
    WorkspaceFilesResponse:
      properties:
        fileCount:
          default: 0
          type: integer
        files:
          items:
            $ref: '#/components/schemas/FileInfo'
          type: array
        hasMore:
          default: false
          type: boolean
        root:
          type: string
      required:
      - root
      - files
      title: WorkspaceFilesResponse
      type: object
    _AppConfig:
      description: 'Program-specific configuration.


        Configuration for frontends or runtimes that is specific to

        a single marimo program.'
      properties:
        app_title:
          anyOf:
          - type: string
          - type: 'null'
          default: null
        auto_download:
          items:
            enum:
            - html
            - ipynb
            - markdown
          type: array
        css_file:
          anyOf:
          - type: string
          - type: 'null'
          default: null
        html_head_file:
          anyOf:
          - type: string
          - type: 'null'
          default: null
        layout_file:
          anyOf:
          - type: string
          - type: 'null'
          default: null
        sql_output:
          default: auto
          enum:
          - auto
          - lazy-polars
          - native
          - pandas
          - polars
        width:
          default: compact
          enum:
          - columns
          - compact
          - full
          - medium
          - normal
      required: []
      title: _AppConfig
      type: object
info:
  title: marimo API
openapi: 3.1.0
paths:
  /@file/{filename_and_length}:
    get:
      parameters:
      - description: The filename and byte length of the virtual file
        in: path
        name: filename_and_length
        required: true
        schema:
          type: string
      responses:
        200:
          content:
            application/octet-stream:
              schema:
                type: string
          description: Get a virtual file
        404:
          description: Invalid byte length in virtual file request
  /api/ai/chat:
    post:
      parameters:
      - in: header
        name: Marimo-Session-Id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        description: The request body for AI chat
        required: true
  /api/ai/completion:
    post:
      parameters:
      - in: header
        name: Marimo-Session-Id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiCompletionRequest'
        description: The request body for AI completion
        required: true
      responses:
        200:
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: Get AI completion for a prompt
  /api/ai/inline_completion:
    post:
      parameters:
      - in: header
        name: Marimo-Session-Id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiInlineCompletionRequest'
        description: The request body for AI inline completion
        required: true
      responses:
        200:
          content:
            text/plain:
              schema:
                type: string
          description: Get AI inline completion for code
  /api/ai/invoke_tool:
    post:
      parameters:
      - in: header
        name: Marimo-Session-Id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvokeAiToolRequest'
        description: The request body for tool invocation
        required: true
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvokeAiToolResponse'
          description: Tool invocation result
  /api/ai/mcp/refresh:
    post:
      parameters:
      - in: header
        name: Marimo-Session-Id
        required: true
        schema:
          type: string
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPRefreshResponse'
          description: Refresh MCP server configuration
  /api/ai/mcp/status:
    get:
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPStatusResponse'
          description: Get MCP server status
  /api/ai/models/{provider_name}:
    get:
      description: List models for a supported provider without modifying configuration.
      parameters:
      - description: Provider identifier, such as `openrouter` or a custom-provider
          name.
        in: path
        name: provider_name
        required: true
        schema:
          type: string
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderModelsResponse'
          description: Available models for the provider.
  /api/cache/clear:
    post:
      parameters:
      - in: header
        name: Marimo-Session-Id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClearCacheRequest'
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: Clear all caches
  /api/cache/info:
    post:
      parameters:
      - in: header
        name: Marimo-Session-Id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetCacheInfoRequest'
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: Get cache statistics
  /api/datasources/discover:
    post:
      parameters:
      - in: header
        name: Marimo-Session-Id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverDataSourcesRequest'
        required: true
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: Discover datasource connections
  /api/datasources/preview_column:
    post:
      parameters:
      - in: header
        name: Marimo-Session-Id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewDatasetColumnRequest'
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: Preview a column in a dataset
  /api/datasources/preview_datasource_connection:
    post:
      parameters:
      - in: header
        name: Marimo-Session-Id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListDataSourceConnectionRequest'
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: Broadcasts a datasource connection
  /api/datasources/preview_sql_schema_list:
    post:
      parameters:
      - in: header
        name: Marimo-Session-Id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListSQLSchemasRequest'
      responses:
