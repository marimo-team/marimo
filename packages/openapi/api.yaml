components:
  schemas:
    ActiveLineNotification:
      description: "Reports the line a cell's frame watcher is currently executing.\n\
        \nEmitted on a timed heartbeat while a cell runs (only when the line\nchanged),\
        \ so the editor can highlight the live line. A `None` line\nclears the highlight\
        \ (e.g. when the cell finishes).\n\nAttributes:\n    cell_id: Cell whose frame\
        \ is being watched.\n    line: 1-based line within the cell, or `None` to\
        \ clear."
      properties:
        cell_id:
          $ref: '#/components/schemas/CellId'
        line:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
        op:
          enum:
          - active-line
      required:
      - op
      - cell_id
      title: ActiveLineNotification
      type: object
    AddPackageRequest:
      description: 'This can be a remove package or a local package.


        Supported formats:


        httpx

        httpx==0.27.0

        httpx>=0.27.0

        git+https://github.com/encode/httpx

        https://files.pythonhosted.org/packages/5c/2d/3da5bdf4408b8b2800061c339f240c1802f2e82d55e50bd39c5a881f47f0/httpx-0.27.0.tar.gz

        /example/foo-0.1.0-py3-none-any.whl'
      properties:
        group:
          anyOf:
          - type: string
          - type: 'null'
          default: null
        package:
          type: string
        upgrade:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
      required:
      - package
      title: AddPackageRequest
      type: object
    AiCompletionContext:
      properties:
        plainText:
          default: ''
          type: string
        schema:
          default: []
          items:
            $ref: '#/components/schemas/SchemaTable'
          type: array
        variables:
          default: []
          items:
            anyOf:
            - type: string
            - $ref: '#/components/schemas/VariableContext'
          type: array
      required: []
      title: AiCompletionContext
      type: object
    AiCompletionRequest:
      description: 'UIMessages are expected to be AI SDK messages.

        See pydantic_ai.ui.vercel_ai.request_types.UIMessage or Vercel AI SDK documentation.'
      properties:
        code:
          type: string
        context:
          anyOf:
          - $ref: '#/components/schemas/AiCompletionContext'
          - type: 'null'
          default: null
        id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
        includeOtherCode:
          type: string
        language:
          default: python
          enum:
          - markdown
          - python
          - sql
        prompt:
          type: string
        selectedText:
          anyOf:
          - type: string
          - type: 'null'
          default: null
        uiMessages:
          default: []
          items:
            type: object
          type: array
      required:
      - prompt
      - includeOtherCode
      - code
      title: AiCompletionRequest
      type: object
    AiConfig:
      description: Configuration options for AI.
      properties:
        allow_provider_config:
          default: true
          description: if `False`, lock provider setup in the settings UI, making
            them read-only. Users cannot bring their own credentials or add custom
            providers. Default `True`.
          type: boolean
        anthropic:
          $ref: '#/components/schemas/AnthropicConfig'
          description: the Anthropic config
        azure:
          $ref: '#/components/schemas/OpenAiConfig'
          description: the Azure config
        bedrock:
          $ref: '#/components/schemas/BedrockConfig'
          description: the Bedrock config
        custom_providers:
          additionalProperties:
            $ref: '#/components/schemas/OpenAiConfig'
          default: {}
          description: a dict of custom OpenAI-compatible providers
          type: object
        enabled:
          default: true
          description: if `False`, hide AI actions and panels in the marimo UI
          type: boolean
        github:
          $ref: '#/components/schemas/GitHubConfig'
          description: the GitHub Copilot config
        google:
          $ref: '#/components/schemas/GoogleAiConfig'
          description: the Google AI config
        inline_tooltip:
          description: if `True`, enable inline AI tooltip suggestions
          type: boolean
        max_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          description: the maximum number of tokens to use in AI completions
        mode:
          default: ask
          description: 'notebook access for the built-in assistant: `"ask"` (read
            only), `"agent"` (suggest edits), or `"code_mode"` (full access). Defaults
            to `"ask"`.'
          enum:
          - agent
          - ask
          - code_mode
          - manual
        models:
          $ref: '#/components/schemas/AiModelConfig'
          description: the models to use for AI completions
        ollama:
          $ref: '#/components/schemas/OpenAiConfig'
          description: the Ollama config
        open_ai:
          $ref: '#/components/schemas/OpenAiConfig'
          description: the OpenAI config
        open_ai_compatible:
          $ref: '#/components/schemas/OpenAiConfig'
          deprecated: true
          description: the OpenAI-compatible config (deprecated, use custom_providers)
        opencode_go:
          $ref: '#/components/schemas/OpenAiConfig'
          description: the OpenCode Go config
        openrouter:
          $ref: '#/components/schemas/OpenAiConfig'
          description: the OpenRouter config
        rules:
          default: ''
          description: custom rules to include in all AI completion prompts
          type: string
        wandb:
          $ref: '#/components/schemas/OpenAiConfig'
          description: the Weights & Biases config
      required:
      - enabled
      - rules
      - max_tokens
      - mode
      - allow_provider_config
      - models
      - custom_providers
      title: AiConfig
      type: object
    AiInlineCompletionRequest:
      properties:
        language:
          default: python
          enum:
          - markdown
          - python
          - sql
        prefix:
          type: string
        suffix:
          type: string
      required:
      - prefix
      - suffix
      title: AiInlineCompletionRequest
      type: object
    AiModelConfig:
      description: Configuration options for an AI model.
      properties:
        autocomplete_model:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: the model to use for code completion/autocomplete
        chat_model:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: the model to use for chat completions
        custom_models:
          default: []
          description: a list of custom models to use that are not from the default
            list
          items:
            type: string
          type: array
        displayed_models:
          default: []
          description: a list of models to display in the UI
          items:
            type: string
          type: array
        edit_model:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: the model to use for edit completions
      required:
      - chat_model
      - edit_model
      - autocomplete_model
      - displayed_models
      - custom_models
      title: AiModelConfig
      type: object
    AlertNotification:
      description: "User-facing alert message.\n\nAttributes:\n    title: Alert title.\n\
        \    description: Alert body (may contain HTML).\n    variant: Visual variant\
        \ (e.g., \"danger\")."
      properties:
        description:
          type: string
        op:
          enum:
          - alert
        title:
          type: string
        variant:
          anyOf:
          - enum:
            - danger
          - type: 'null'
          default: null
      required:
      - op
      - title
      - description
      title: AlertNotification
      type: object
    AnthropicConfig:
      description: Configuration options for Anthropic.
      properties:
        api_key:
          description: the Anthropic API key or an `env:` reference
          type: string
      required: []
      title: AnthropicConfig
      type: object
    AutoExportAsIPYNBRequest:
      properties:
        download:
          type: boolean
      required:
      - download
      title: AutoExportAsIPYNBRequest
      type: object
    AutoExportAsMarkdownRequest:
      properties:
        download:
          type: boolean
      required:
      - download
      title: AutoExportAsMarkdownRequest
      type: object
    BannerNotification:
      description: "Persistent banner message at top of notebook.\n\nAttributes:\n\
        \    title: Banner title.\n    description: Banner body (may contain HTML).\n\
        \    variant: Visual variant (e.g., \"danger\").\n    action: Optional user\
        \ action (e.g., \"restart\")."
      properties:
        action:
          anyOf:
          - enum:
            - restart
          - type: 'null'
          default: null
        description:
          type: string
        op:
          enum:
          - banner
        title:
          type: string
        variant:
          anyOf:
          - enum:
            - danger
          - type: 'null'
          default: null
      required:
      - op
      - title
      - description
      title: BannerNotification
      type: object
    Base64String:
      contentEncoding: base64
      format: base64
      type: string
    BaseResponse:
      properties:
        success:
          type: boolean
      required:
      - success
      title: BaseResponse
      type: object
    BasedpyrightServerConfig:
      description: 'Configuration options for basedpyright Language Server.


        basedpyright handles completion, hover, go-to-definition, and diagnostics,

        but we only use it for diagnostics.'
      properties:
        enabled:
          description: Enable this language server.
          type: boolean
      required: []
      title: BasedpyrightServerConfig
      type: object
    BedrockConfig:
      description: Configuration options for Bedrock.
      properties:
        aws_access_key_id:
          description: the AWS access key ID
          type: string
        aws_secret_access_key:
          description: the AWS secret access key
          type: string
        profile_name:
          description: the AWS profile to use
          type: string
        region_name:
          description: the AWS region to use
          type: string
      required: []
      title: BedrockConfig
      type: object
    CacheClearedNotification:
      description: "Execution cache cleared result.\n\nAttributes:\n    bytes_freed:\
        \ Bytes freed by clearing cache."
      properties:
        bytes_freed:
          type: integer
        op:
          enum:
          - cache-cleared
      required:
      - op
      - bytes_freed
      title: CacheClearedNotification
      type: object
    CacheConfig:
      description: Configuration for caching.
      properties:
        loader:
          anyOf:
          - enum:
            - json
            - lazy
            - pickle
          - type: string
          default: lazy
          description: Default loader for mo.persistent_cache.
        store:
          anyOf:
          - items:
              $ref: '#/components/schemas/StoreConfig'
            type: array
          - $ref: '#/components/schemas/StoreConfig'
          - type: 'null'
          default: null
          description: Backing cache store, or a list of stores composed into a tiered
            store.
        verification:
          default: 'off'
          description: 'Cache signature verification posture: off, on, or strict.'
          enum:
          - 'off'
          - 'on'
          - strict
      required:
      - verification
      - store
      - loader
      title: CacheConfig
      type: object
    CacheInfoNotification:
      description: "Execution cache statistics.\n\nAttributes:\n    hits: Cache hits.\n\
        \    misses: Cache misses.\n    time: Time spent on cache operations (seconds).\n\
        \    disk_to_free: Disk space that could be freed (bytes).\n    disk_total:\
        \ Total disk space used (bytes)."
      properties:
        disk_to_free:
          type: integer
        disk_total:
          type: integer
        hits:
          type: integer
        misses:
          type: integer
        op:
          enum:
          - cache-info
        time:
          type: number
      required:
      - op
      - hits
      - misses
      - time
      - disk_to_free
      - disk_total
      title: CacheInfoNotification
      type: object
    CellChannel:
      description: The channel of a cell's output.
      enum:
      - marimo-error
      - media
      - output
      - pdb
      - stderr
      - stdin
      - stdout
      title: CellChannel
    CellConfig:
      description: 'Internal representation of a cell''s configuration.

        This is not part of the public API.'
      properties:
        column:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
        disabled:
          default: false
          type: boolean
        expand_output:
          default: false
          type: boolean
        hide_code:
          default: false
          type: boolean
      required: []
      title: CellConfig
      type: object
    CellId:
      format: cell-id
      type: string
    CellNotification:
      description: "Updates a cell's state in the frontend.\n\nThis is a partial update:\
        \ each field carries its own \"unchanged\" semantics,\ndocumented per field\
        \ below. Most fields treat None as \"unchanged\"; fields\nthat need to distinguish\
        \ \"unchanged\" from \"clear\" use msgspec.UNSET for the\nformer and None\
        \ for the latter.\n\nAttributes:\n    cell_id: Unique identifier of the cell\
        \ being updated.\n    output: Cell's output. Use CellOutput.empty() to clear.\n\
        \    console: Console messages. Single/list appends, [] clears, None unchanged.\n\
        \    status: Execution status (idle/running/stale/queued/disabled-transitively).\n\
        \    run_id: Execution run ID for tracing. Auto-set from context.\n    execution_id:\
        \ Evaluation of this cell producing the update, when known.\n    serialization:\
        \ Top-level reusability hint. UNSET unchanged, None clears, str sets.\n  \
        \  timestamp: Creation timestamp, auto-set."
      properties:
        cell_id:
          $ref: '#/components/schemas/CellId'
        console:
          anyOf:
          - items:
              $ref: '#/components/schemas/CellOutput'
            type: array
          - $ref: '#/components/schemas/CellOutput'
          - type: 'null'
          default: null
        execution_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
        op:
          enum:
          - cell-op
        output:
          anyOf:
          - $ref: '#/components/schemas/CellOutput'
          - type: 'null'
          default: null
        run_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
        serialization:
          anyOf:
          - type: string
          - type: 'null'
        status:
          anyOf:
          - enum:
            - disabled-transitively
            - idle
            - queued
            - running
          - type: 'null'
          default: null
        timestamp:
          type: number
      required:
      - op
      - cell_id
      title: CellNotification
      type: object
    CellOutput:
      properties:
        channel:
          $ref: '#/components/schemas/CellChannel'
        code:
          type: string
        data:
          anyOf:
          - type: string
          - items:
              anyOf:
              - $ref: '#/components/schemas/SetupRootError'
              - $ref: '#/components/schemas/CycleError'
              - $ref: '#/components/schemas/MultipleDefinitionError'
              - $ref: '#/components/schemas/ImportStarError'
              - $ref: '#/components/schemas/LazyImportError'
              - $ref: '#/components/schemas/MarimoAncestorStoppedError'
              - $ref: '#/components/schemas/MarimoAncestorPreventedError'
              - $ref: '#/components/schemas/MarimoExceptionRaisedError'
              - $ref: '#/components/schemas/MarimoStrictExecutionError'
              - $ref: '#/components/schemas/MarimoInterruptionError'
              - $ref: '#/components/schemas/MarimoSyntaxError'
              - $ref: '#/components/schemas/MarimoInternalError'
              - $ref: '#/components/schemas/MarimoSQLError'
              - $ref: '#/components/schemas/UnknownError'
              discriminator:
                mapping:
                  ancestor-prevented: '#/components/schemas/MarimoAncestorPreventedError'
                  ancestor-stopped: '#/components/schemas/MarimoAncestorStoppedError'
                  cycle: '#/components/schemas/CycleError'
                  exception: '#/components/schemas/MarimoExceptionRaisedError'
                  import-star: '#/components/schemas/ImportStarError'
                  internal: '#/components/schemas/MarimoInternalError'
                  interruption: '#/components/schemas/MarimoInterruptionError'
                  lazy-import: '#/components/schemas/LazyImportError'
                  multiple-defs: '#/components/schemas/MultipleDefinitionError'
                  setup-refs: '#/components/schemas/SetupRootError'
                  sql-error: '#/components/schemas/MarimoSQLError'
                  strict-exception: '#/components/schemas/MarimoStrictExecutionError'
                  syntax: '#/components/schemas/MarimoSyntaxError'
                  unknown: '#/components/schemas/UnknownError'
                propertyName: type
            type: array
          - type: object
        input_id:
          type: string
        mimetype:
          enum:
          - application/json
          - application/vnd.jupyter.widget-view+json
          - application/vnd.marimo+error
          - application/vnd.marimo+mimebundle
          - application/vnd.marimo+traceback
          - application/vnd.vega.v5+json
          - application/vnd.vega.v6+json
          - application/vnd.vegalite.v5+json
          - application/vnd.vegalite.v6+json
          - image/avif
          - image/bmp
          - image/gif
          - image/jpeg
          - image/png
          - image/svg+xml
          - image/tiff
          - text/csv
          - text/html
          - text/latex
          - text/markdown
          - text/password
          - text/plain
          - video/mp4
          - video/mpeg
        timestamp:
          type: number
        traceback_format:
          enum:
          - html
          - text
      required:
      - channel
      - mimetype
      - data
      title: CellOutput
      type: object
    CellOutputs:
      description: 'Per-cell output snapshot delivered alongside the document snapshot.


        `output` carries the cell''s last main (rich display) output;

        `console_outputs` carries the buffered stdout/stderr stream from

        its last execution.  Both are keyed by cell id; missing keys mean

        "no output captured" (the cell never ran, or produced nothing on

        that channel).'
      properties:
        console_outputs:
          additionalProperties:
            items:
              $ref: '#/components/schemas/CellOutput'
            type: array
          type: object
        output:
          additionalProperties:
            $ref: '#/components/schemas/CellOutput'
          type: object
      required:
      - output
      - console_outputs
      title: CellOutputs
      type: object
    ChatAttachment:
      properties:
        content_type:
          anyOf:
          - type: string
          - type: 'null'
          default: null
        name:
          default: attachment
          type: string
        url:
          type: string
      required:
      - url
      title: ChatAttachment
      type: object
    ChatMessage:
      description: A message in a chat.
      properties:
        attachments:
          anyOf:
          - items:
              $ref: '#/components/schemas/ChatAttachment'
            type: array
          - type: 'null'
          default: null
        content: {}
        id:
          default: ''
          type: string
        metadata:
          anyOf:
          - {}
          - type: 'null'
          default: null
        parts:
          default: []
          items:
            type: object
          type: array
        role:
          enum:
          - assistant
          - system
          - user
      required:
      - role
      - content
      title: ChatMessage
      type: object
    ChatOptions:
      description: Used to configure capabilities of the AI agent.
      properties:
        webSearch:
          default: false
          type: boolean
      required: []
      title: ChatOptions
      type: object
    ChatRequest:
      description: 'UIMessages are expected to be AI SDK messages.

        See pydantic_ai.ui.vercel_ai.request_types.UIMessage or Vercel AI SDK documentation.'
      properties:
        id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
        model:
          anyOf:
          - type: string
          - type: 'null'
          default: null
        options:
          $ref: '#/components/schemas/ChatOptions'
        tools:
          anyOf:
          - items:
              $ref: '#/components/schemas/ToolDefinition'
            type: array
          - type: 'null'
          default: null
        uiMessages:
          items:
            type: object
          type: array
        variables:
          anyOf:
          - items:
              anyOf:
              - type: string
              - $ref: '#/components/schemas/VariableContext'
            type: array
          - type: 'null'
          default: null
      required:
      - uiMessages
      title: ChatRequest
      type: object
    ClearCacheRequest:
      properties: {}
      required: []
      title: ClearCacheRequest
      type: object
    ClientCommand:
      anyOf:
      - $ref: '#/components/schemas/ExecuteCellsCommand'
      - $ref: '#/components/schemas/ExecuteScratchpadCommand'
      - $ref: '#/components/schemas/DeleteCellCommand'
      - $ref: '#/components/schemas/UpdateCellConfigCommand'
      - $ref: '#/components/schemas/UpdateUIElementCommand'
      - $ref: '#/components/schemas/ModelCommand'
      - $ref: '#/components/schemas/InvokeFunctionCommand'
      - $ref: '#/components/schemas/InstallPackagesCommand'
      - $ref: '#/components/schemas/PreviewDatasetColumnCommand'
      - $ref: '#/components/schemas/PreviewSQLTableCommand'
      - $ref: '#/components/schemas/ListSQLTablesCommand'
      - $ref: '#/components/schemas/ListSQLSchemasCommand'
      - $ref: '#/components/schemas/ValidateSQLCommand'
      - $ref: '#/components/schemas/ListDataSourceConnectionCommand'
      - $ref: '#/components/schemas/DiscoverDataSourcesCommand'
      - $ref: '#/components/schemas/ListSecretKeysCommand'
      discriminator:
        mapping:
          delete-cell: '#/components/schemas/DeleteCellCommand'
          discover-data-sources: '#/components/schemas/DiscoverDataSourcesCommand'
          execute-cells: '#/components/schemas/ExecuteCellsCommand'
          execute-scratchpad: '#/components/schemas/ExecuteScratchpadCommand'
          install-packages: '#/components/schemas/InstallPackagesCommand'
          invoke-function: '#/components/schemas/InvokeFunctionCommand'
          list-data-source-connection: '#/components/schemas/ListDataSourceConnectionCommand'
          list-secret-keys: '#/components/schemas/ListSecretKeysCommand'
          list-sql-schemas: '#/components/schemas/ListSQLSchemasCommand'
          list-sql-tables: '#/components/schemas/ListSQLTablesCommand'
          model: '#/components/schemas/ModelCommand'
          preview-dataset-column: '#/components/schemas/PreviewDatasetColumnCommand'
          preview-sql-table: '#/components/schemas/PreviewSQLTableCommand'
          update-cell-config: '#/components/schemas/UpdateCellConfigCommand'
          update-ui-element: '#/components/schemas/UpdateUIElementCommand'
          validate-sql: '#/components/schemas/ValidateSQLCommand'
        propertyName: type
    CodeCompletionRequest:
      properties:
        cellId:
          $ref: '#/components/schemas/CellId'
        document:
          type: string
        id:
          $ref: '#/components/schemas/RequestId'
      required:
      - id
      - document
      - cellId
      title: CodeCompletionRequest
      type: object
    ColumnStats:
      description: Represents stats for a column in a data table.
      properties:
        'false':
          anyOf:
          - type: integer
          - type: 'null'
          default: null
        max:
          anyOf:
          - {}
          - type: 'null'
          default: null
        mean:
          anyOf:
          - {}
          - type: 'null'
          default: null
        median:
          anyOf:
          - {}
          - type: 'null'
          default: null
        min:
          anyOf:
          - {}
          - type: 'null'
          default: null
        nulls:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
        p25:
          anyOf:
          - {}
          - type: 'null'
          default: null
        p5:
          anyOf:
          - {}
          - type: 'null'
          default: null
        p75:
          anyOf:
          - {}
          - type: 'null'
          default: null
        p95:
          anyOf:
          - {}
          - type: 'null'
          default: null
        std:
          anyOf:
          - {}
          - type: 'null'
          default: null
        total:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
        'true':
          anyOf:
          - type: integer
          - type: 'null'
          default: null
        unique:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
      required: []
      title: ColumnStats
      type: object
    CompletedRunNotification:
      description: The command's reactive cycle ended, after its console was flushed.
      properties:
        error:
          anyOf:
          - type: string
          - type: 'null'
          default: null
        op:
          enum:
          - completed-run
        outcome:
          default: succeeded
          enum:
          - failed
          - interrupted
          - succeeded
        run_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
      required:
      - op
      title: CompletedRunNotification
      type: object
    CompletionConfig:
      description: 'Configuration for code completion.


        Settings for code completion in the marimo editor.'
      properties:
        activate_on_typing:
          default: true
          description: if `False`, completion won't activate until the completion
            hotkey is entered
          type: boolean
        api_key:
          anyOf:
          - type: string
          - type: 'null'
          deprecated: true
          description: Deprecated completion API key. Use an AI provider configuration
            instead.
        auto_close_pairs:
          default: true
          description: if `False`, typing an opening bracket, parenthesis, or quote
            will not automatically insert the closing character
          type: boolean
        base_url:
          anyOf:
          - type: string
          - type: 'null'
