        \ Dependent cells may be\nre-executed based on the reactive execution mode.\n\
        \nAttributes:\n    cell_id: Cell to execute.\n    code: Python code to execute.\n\
        \    code_fingerprint: Code fingerprint. Computed from `code` when omitted.\n\
        \    request: HTTP request context if available.\n    timestamp: Unix timestamp\
        \ when command was created."
      properties:
        cellId:
          $ref: '#/components/schemas/CellId'
        code:
          type: string
        codeFingerprint:
          default: ''
          type: string
        request:
          anyOf:
          - $ref: '#/components/schemas/HTTPRequest'
          - type: 'null'
          default: null
        timestamp:
          type: number
        type:
          enum:
          - execute-cell
      required:
      - type
      - cellId
      - code
      title: ExecuteCellCommand
      type: object
    ExecuteCellsCommand:
      description: "Execute cells and their reactive dependents in one batch.\n\n\
        Attributes:\n    execution_requests: The cells and source identities to execute.\n\
        \    request: HTTP request context for the batch.\n    timestamp: Unix timestamp\
        \ when the batch was created.\n    run_id: Correlates the run's notifications\
        \ and completion.\n    allow_stdin: Whether cells may request interactive\
        \ input."
      properties:
        allowStdin:
          default: true
          type: boolean
        executionRequests:
          items:
            $ref: '#/components/schemas/ExecuteCellCommand'
          type: array
        request:
          anyOf:
          - $ref: '#/components/schemas/HTTPRequest'
          - type: 'null'
          default: null
        runId:
          anyOf:
          - type: string
          - type: 'null'
          default: null
        timestamp:
          type: number
        type:
          enum:
          - execute-cells
      required:
      - type
      - executionRequests
      title: ExecuteCellsCommand
      type: object
    ExecuteScratchpadCommand:
      description: "Execute code in the scratchpad.\n\nThe scratchpad is a temporary\
        \ execution environment that doesn't affect\nthe notebook's cells or dependencies.\
        \ Runs in an isolated cell with a copy\nof the global namespace, useful for\
        \ experimentation.\n\nAttributes:\n    code: Python code to execute.\n   \
        \ code_fingerprint: Code fingerprint. Computed from `code` when omitted.\n\
        \    request: HTTP request context if available.\n    notebook_cells: Snapshot\
        \ of notebook cells from the session document.\n        Used to populate the\
        \ document ContextVar so code_mode can read\n        cell ordering, code,\
        \ names, and configs.\n    cell_outputs: Snapshot of per-cell outputs (main\
        \ + console) from the\n        session view. Populates a parallel ContextVar\
        \ so code_mode can\n        expose `cell.output` and `cell.console_outputs`.\
        \ Frozen at\n        scratchpad start \u2014 not refreshed when `ctx.run_cell`\
        \ produces\n        new outputs in the same batch.\n    run_id: Optional correlation\
        \ ID. When set, the\n        `CompletedRunNotification` emitted at the end\
        \ of this command\n        carries the same `run_id` so a caller holding a\n\
        \        `ScratchCellListener` can filter for *its* completion and\n     \
        \   ignore `CompletedRun` events from unrelated commands on the\n        same\
        \ session.\n    allow_stdin: Whether code may request interactive input. When\
        \ false,\n        input reads receive EOF for the duration of this command."
      properties:
        allowStdin:
          default: true
          type: boolean
        cellOutputs:
          anyOf:
          - $ref: '#/components/schemas/CellOutputs'
          - type: 'null'
          default: null
        code:
          type: string
        codeFingerprint:
          default: ''
          type: string
        notebookCells:
          anyOf:
          - items:
              $ref: '#/components/schemas/NotebookCell'
            type: array
          - type: 'null'
          default: null
        request:
          anyOf:
          - $ref: '#/components/schemas/HTTPRequest'
          - type: 'null'
          default: null
        runId:
          anyOf:
          - type: string
          - type: 'null'
          default: null
        type:
          enum:
          - execute-scratchpad
      required:
      - type
      - code
      title: ExecuteScratchpadCommand
      type: object
    ExecuteScratchpadRequest:
      properties:
        allowStdin:
          default: true
          type: boolean
        cellOutputs:
          anyOf:
          - $ref: '#/components/schemas/CellOutputs'
          - type: 'null'
          default: null
        code:
