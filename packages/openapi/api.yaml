        \ edit the notebook)\n- read-only viewer: `{edit: False, interact: False}`\
        \ (opt-in, set by a\n  deployment's capability provider)\n\nThe server enforces\
        \ these: control requests are gated against the issuing\nconsumer's stored\
        \ capabilities at the control-request chokepoint (the\nauthority) and mirrored\
