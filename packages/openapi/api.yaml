        esm_spec:
          anyOf:
          - $ref: '#/components/schemas/EsmSpec'
          - type: 'null'
          default: null
        method:
          enum:
          - update
        state:
          type: object
      required:
      - method
      - state
      - buffer_paths
      - buffers
      title: ModelUpdate
      type: object
    ModelUpdateMessage:
      description: "Widget model state update message.\n\nAttributes:\n    state:\
