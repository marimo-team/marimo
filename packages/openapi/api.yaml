    RuntimeConfig:
      description: Configuration for runtime.
      properties:
        auto_instantiate:
          default: false
          description: if `False`, cells won't automatically run on startup. This
            only applies when editing a notebook, and not when running as an application.
          type: boolean
        auto_reload:
          default: 'off'
          description: If `lazy`, mark cells importing modified modules as stale;
            if `autorun`, automatically run affected cells. Similar to IPython's %autoreload
            extension, with dependency-aware execution.
          enum:
          - autorun
          - lazy
          - 'off'
        cache_cells:
          default: false
          description: Enable experimental automatic cell caching.
          type: boolean
        default_auto_download:
          default: []
          description: 'an Optional list of export types to automatically snapshot
            your notebook as: `html`, `markdown`, `ipynb`.'
          items:
            enum:
            - html
            - ipynb
            - markdown
          type: array
        default_csv_encoding:
          default: utf-8
          description: the default encoding for CSV exports.
          type: string
        default_sql_output:
          default: auto
          description: 'the default output format for SQL queries. Can be one of:
            `"auto"`, `"native"`, `"polars"`, `"lazy-polars"`, or `"pandas"`.'
          enum:
          - auto
          - lazy-polars
          - native
          - pandas
          - polars
        dotenv:
          description: Override .env discovery with a list of files to load. Use an
            empty list to skip .env loading entirely. In project settings and script
            metadata, paths are relative to the project folder, or the notebook's
            folder if there is no project. In user settings, paths must be absolute.
          items:
            type: string
          type: array
        execution_type:
          description: 'Cell declaration handling: relaxed or strict.'
          enum:
          - relaxed
          - strict
        on_cell_change:
          default: autorun
          description: if `lazy`, cells will be marked stale when their ancestors
            run but won't autorun; if `autorun`, cells will automatically run when
            their ancestors run.
          enum:
          - autorun
          - lazy
        output_max_bytes:
          default: 8000000
          description: the maximum size in bytes of cell outputs; larger values may
            affect frontend performance
          type: integer
        pin_modules:
          default: true
          description: Pin imported modules when caching cells.
          type: boolean
        pythonpath:
          default: []
          description: a list of directories to add to the Python search path. Directories
            will be added to the head of sys.path. Similar to the `PYTHONPATH` environment
            variable, the directories will be included in where Python will look for
            imported modules.
          items:
            type: string
          type: array
        reactive_tests:
          default: true
          description: If `True`, automatically run pytest on cells containing only
            test functions and test classes.
          type: boolean
        serve_cached_sessions_in_apps:
          default: false
          description: if `True`, initialize applications with session cache.
          type: boolean
        show_tracebacks:
          default: false
          description: if `True`, show detailed error tracebacks in run mode. When
            enabled, exceptions will display a clickable toast that opens a modal
            with the full traceback.
          type: boolean
        sql_default_limit:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          description: Default maximum number of SQL result rows when a query has
            no LIMIT. Must be non-negative; None means no limit.
        std_stream_max_bytes:
          default: 1000000
          description: the maximum size in bytes of console outputs; larger values
            may affect frontend performance
          type: integer
        watcher_on_save:
          default: lazy
          description: how to handle file changes when saving. `"lazy"` marks affected
            cells as stale, `"autorun"` automatically runs affected cells.
          enum:
          - autorun
          - lazy
      required:
      - auto_instantiate
      - auto_reload
      - reactive_tests
      - on_cell_change
      - watcher_on_save
      - output_max_bytes
      - serve_cached_sessions_in_apps
      - std_stream_max_bytes
      - pythonpath
      - default_sql_output
      - default_auto_download
      - default_csv_encoding
      - show_tracebacks
      - cache_cells
      - pin_modules
      title: RuntimeConfig
      type: object
