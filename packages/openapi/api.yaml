    ModelOpen:
      description: "Initial widget state on creation.\n\nFor anywidgets, the widget's\
        \ ESM does not travel in `state`: the\ncomm strips `_esm` and sends an `EsmSpec`\
        \ instead. `None` for\nmodels with no ESM (e.g. traditional ipywidgets).\n\
        \nAttributes:\n    state: Initial trait values, minus `_esm`.\n    buffer_paths:\
        \ Paths into `state` whose binary values were\n        extracted into `buffers`.\n\
        \    buffers: Binary payloads, parallel to `buffer_paths`.\n    esm_spec:\
        \ Where to import this widget's ESM from."
      properties:
        buffer_paths:
          items:
            items:
              anyOf:
              - type: string
              - type: integer
            type: array
          type: array
        buffers:
          items:
            $ref: '#/components/schemas/Base64String'
          type: array
        esm_spec:
          anyOf:
          - $ref: '#/components/schemas/EsmSpec'
          - type: 'null'
          default: null
        method:
          enum:
          - open
        state:
          type: object
      required:
      - method
      - state
      - buffer_paths
      - buffers
      title: ModelOpen
      type: object
    ModelRequest:
      properties:
        buffers:
          items:
            $ref: '#/components/schemas/Base64String'
          type: array
        message:
          anyOf:
          - $ref: '#/components/schemas/ModelUpdateMessage'
          - $ref: '#/components/schemas/ModelCustomMessage'
          discriminator:
            mapping:
              custom: '#/components/schemas/ModelCustomMessage'
