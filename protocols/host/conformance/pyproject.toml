[project]
name = "marimo-host-conformance"
version = "0.1.0"
description = "Portable checks for the marimo host protocol"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "python-jsonpath==2.2.1",
    "msgspec[yaml]==0.22.0",
    "psutil==7.2.2",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = [".", ".."]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
